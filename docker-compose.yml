# Oracle Database 23ai Free cho đồ án (dùng trên MÁY MỚI).
# Nếu máy đã có sẵn container Oracle (ví dụ "oracle23ai") đang dùng cổng 1521 thì KHÔNG cần
# chạy file này; chỉ cần đặt ORACLE_CONTAINER trong .env cho đúng tên container đó.
#
#   copy .env.example .env      (rồi đổi ORACLE_PWD)
#   docker compose up -d        (lần đầu mất vài phút để tạo CSDL)
#   docker compose ps           (đợi cột STATUS báo healthy)
services:
  oracle:
    # Đã kiểm thử với bản 23.26.3 (Oracle AI Database 26ai Free, thuộc dòng 23ai).
    # Duality View viết bằng SQL cần tối thiểu 23.4.
    image: container-registry.oracle.com/database/free:latest
    container_name: ${ORACLE_CONTAINER:-oracle23ai}
    ports:
      - "1521:1521"
    environment:
      # Mật khẩu SYS/SYSTEM/PDBADMIN, đọc từ file .env (không commit .env)
      ORACLE_PWD: ${ORACLE_PWD:?Hay dat ORACLE_PWD trong file .env}
    volumes:
      # Dữ liệu CSDL nằm ở volume riêng -> xoá container không mất dữ liệu
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped

volumes:
  oracle-data:
